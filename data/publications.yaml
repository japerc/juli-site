# Publications data — single source of truth.
#
# `groups` defines the ordered list of publication groups shown on the
# Publications page. Each group references entries by ID.
#
# `entries` is a flat dict keyed by stable ID. Each record has:
#   year     : integer. Rendered in the year column on the publications page.
#   authors  : string. May contain inline HTML. Do not include the year here —
#              it lives in `year` and is rendered in its own column.
#   title    : string. May contain <em> for italicized work titles.
#   venue    : string. May contain <em> for italicized work titles.
#   lang     : optional BCP-47 code applied to <p class="pub-title"> and <p class="pub-venue">.
#   link     : optional { url, label } — renders as <p class="pub-doi"><a>label</a></p>.
#   projects : optional list of project keys (matched against project pages'
#              project_key frontmatter to populate "Related Publications").
#
# All string fields go through Hugo's safeHTML — write a literal ampersand as
# `&amp;` so it survives untouched. Plain text otherwise needs no escaping.

groups:
  - name: Journal Articles
    entries:
      - journal-flytipping
      - journal-hu-environmentalism
      - journal-toxic-flows
      - journal-waste-tide
      - journal-toxicity
  - name: Book Chapters
    entries:
      - chapter-circular
  - name: PhD Thesis
    entries:
      - thesis-2022
  - name: Public & Online Writing
    entries:
      - public-allegra

entries:
  journal-flytipping:
    year: 2025
    authors: 'Holmes, H. &amp; Perczel, J.'
    title: 'Fly-tipping and the sociology of abandonment'
    venue: 'The Sociological Review, 73(3), 607–625.'
    link:
      url: 'https://doi.org/10.1177/00380261241285183'
      label: 'doi:10.1177/00380261241285183'

  journal-hu-environmentalism:
    year: 2025
    authors: 'Perczel, J.'
